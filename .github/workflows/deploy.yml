name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Môi trường deploy'
        required: false
        default: 'production'
        type: choice
        options: [production, dev]
      tag:
        description: 'Image tag để deploy (latest, v1.2.3, sha-...)'
        required: false
        default: 'latest'
        type: string
      target:
        description: 'Thành phần cần deploy'
        required: false
        default: 'both'
        type: choice
        options: [both, web, server]
      run_migrations:
        description: 'Chạy DB migrations trước khi restart server'
        required: false
        default: true
        type: boolean

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage deploy files
        env:
          DEPLOY_ENV: ${{ inputs.environment || 'production' }}
        run: |
          mkdir -p staging
          cp docker-compose.yml staging/
          cp server/scripts/deploy.sh staging/
          if [ "$DEPLOY_ENV" = "dev" ]; then
            cp env.development staging/env.development
          fi

      - name: Upload deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "staging/*"
          target: ${{ inputs.environment == 'dev' && secrets.SERVER_DEPLOY_PATH_DEV || secrets.SERVER_DEPLOY_PATH }}
          strip_components: 1

      - name: Run deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 20m
          script: |
            set -e
            cd "${{ inputs.environment == 'dev' && secrets.SERVER_DEPLOY_PATH_DEV || secrets.SERVER_DEPLOY_PATH }}"
            chmod +x deploy.sh
            VERSION='${{ inputs.tag || 'latest' }}' \
            SERVICES='${{ inputs.target == 'web' && 'web' || (inputs.target == 'server' && 'api,chat,migrate' || 'api,chat,web,migrate') }}' \
            RUN_MIGRATIONS='${{ inputs.run_migrations == false && 'false' || 'true' }}' \
            ENV_FILE='${{ inputs.environment == 'dev' && 'env.development' || '.env' }}' \
            HEALTH_URL='${{ inputs.environment == 'dev' && 'http://localhost:5242/api/v1/health' || 'http://localhost:5241/api/v1/health' }}' \
            WEB_HEALTH_URL='${{ inputs.environment == 'dev' && 'http://localhost:5082' || 'http://localhost:5081' }}' \
            ./deploy.sh

name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Môi trường deploy'
        required: false
        default: 'production'
        type: choice
        options: [production, dev]
      tag:
        description: 'Image tag để deploy (latest, v1.2.3, sha-...)'
        required: false
        default: 'latest'
        type: string
      target:
        description: 'Thành phần cần deploy'
        required: false
        default: 'both'
        type: choice
        options: [both, web, server]
      run_seed:
        description: 'Seed database với test data (100 users + 10 rooms)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage deploy files
        env:
          DEPLOY_ENV: ${{ inputs.environment || 'production' }}
        run: |
          mkdir -p staging
          cp docker-compose.yml staging/
          cp server/scripts/deploy.sh staging/
          if [ "$DEPLOY_ENV" = "dev" ]; then
            cp env.development staging/env.development
          fi

      - name: Upload deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "staging/*"
          target: ${{ inputs.environment == 'dev' && secrets.SERVER_DEPLOY_PATH_DEV || secrets.SERVER_DEPLOY_PATH }}
          strip_components: 1

      - name: Run deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 20m
          script: |
            set -e
            cd "${{ inputs.environment == 'dev' && secrets.SERVER_DEPLOY_PATH_DEV || secrets.SERVER_DEPLOY_PATH }}"
            chmod +x deploy.sh
            VERSION='${{ inputs.tag || 'latest' }}' \
            SERVICES='${{ inputs.target == 'web' && 'web' || (inputs.target == 'server' && 'api,chat,migrate' || 'api,chat,web,migrate') }}' \
            ENV_FILE='${{ inputs.environment == 'dev' && 'env.development' || '.env' }}' \
            HEALTH_URL='${{ inputs.environment == 'dev' && 'http://localhost:5242/api/v1/health' || 'http://localhost:5241/api/v1/health' }}' \
            WEB_HEALTH_URL='${{ inputs.environment == 'dev' && 'http://localhost:5082' || 'http://localhost:5081' }}' \
            ./deploy.sh

            if [ '${{ inputs.run_seed }}' = 'true' ]; then
              echo "🌱 Running database seed..."
              ENV_FILE='${{ inputs.environment == 'dev' && 'env.development' || '.env' }}'
              docker compose --env-file "$ENV_FILE" run --rm -T migrate seed
              echo "✅ Seed completed"
            fi

  notify:
    needs: [deploy]
    # Chỉ báo khi deploy thành công.
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Thông báo Discord
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          title: "🚀 Deploy thành công — ${{ inputs.environment }}"
          description: |
            **Thành phần:** ${{ inputs.target }}
            **Tag:** `${{ inputs.tag }}`
            **Migrations:** auto · **Seed:** ${{ inputs.run_seed }}
            **Commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          username: GitHub Actions
          nofail: true

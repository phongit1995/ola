name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag để deploy (latest, v1.2.3, sha-...)'
        required: false
        default: 'latest'
        type: string
      target:
        description: 'Thành phần cần deploy'
        required: false
        default: 'both'
        type: choice
        options: [both, web, server]
      run_migrations:
        description: 'Chạy DB migrations trước khi restart server'
        required: false
        default: true
        type: boolean

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ inputs.tag || 'latest' }}

jobs:
  deploy-server:
    if: ${{ inputs.target == 'server' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.tag || 'latest' }}
      RUN_MIGRATIONS: ${{ inputs.run_migrations == false && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Prepare SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SERVER_PASSWORD" > ~/.ssh/pw
          chmod 600 ~/.ssh/pw
          ssh-keyscan -H -p "${SERVER_PORT:-22}" "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Upload deploy script
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
        run: |
          sshpass -f ~/.ssh/pw scp -P "$SERVER_PORT" \
            server/scripts/deploy.sh \
            "$SERVER_USER@$SERVER_HOST:$SERVER_DEPLOY_PATH/deploy.sh"
          sshpass -f ~/.ssh/pw ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "chmod +x $SERVER_DEPLOY_PATH/deploy.sh"
      - name: Run deploy
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
        run: |
          sshpass -f ~/.ssh/pw ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "cd $SERVER_DEPLOY_PATH && \
             VERSION='$VERSION' \
             SERVICES='api,chat,migrate' \
             RUN_MIGRATIONS='$RUN_MIGRATIONS' \
             HEALTH_URL='http://localhost:5241/api/health' \
             ./deploy.sh"
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/pw

  deploy-web:
    if: ${{ inputs.target == 'web' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy ola-web
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/ola-web"
            TAG="${{ inputs.tag || 'latest' }}"
            CONTAINER="ola-web"
            HOST_PORT="5081"
            docker pull "$IMAGE:$TAG"
            docker rm -f "$CONTAINER" 2>/dev/null || true
            docker run -d --name "$CONTAINER" \
              --network dockflare-internal \
              -p ${HOST_PORT}:80 \
              --restart unless-stopped \
              --label dockflare.enable=true \
              --label dockflare.hostname=web.ola-server.click \
              --label dockflare.service=http://phong.local:${HOST_PORT} \
              "$IMAGE:$TAG"
            docker image prune -f || true
            docker ps --filter "name=^/${CONTAINER}$" --format "{{.Image}} | {{.Status}} | {{.Ports}}"

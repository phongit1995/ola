name: Build Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Nhánh build'
        required: false
        default: 'production'
        type: string
      tag:
        description: 'Image tag (latest, v1.2.3, ...)'
        required: false
        default: 'latest'
        type: string
      target:
        description: 'Thành phần cần build'
        required: false
        default: 'all'
        type: choice
        options: [all, web, admin, server, game-web]

concurrency:
  group: build-production
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ inputs.tag || 'latest' }}
  BUILD_REF: ${{ inputs.ref || 'production' }}

jobs:
  build-web:
    if: ${{ inputs.target == 'web' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
      - name: Resolve SHA
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Prepare web/.env (VITE_* từ env.production)
        run: grep -E '^VITE_' env.production > web/.env
      - name: Build & push ola-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ola-web:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ola-web:sha-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-admin:
    if: ${{ inputs.target == 'admin' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
      - name: Resolve SHA
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Prepare admin/.env (VITE_* từ env.production)
        run: grep -E '^VITE_' env.production > admin/.env
      - name: Build & push ola-admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/admin/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ola-admin:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ola-admin:sha-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-game-web:
    if: ${{ inputs.target == 'game-web' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
      - name: Resolve SHA
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push ola-game-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/game/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ola-game-web:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ola-game-web:sha-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-server:
    if: ${{ inputs.target == 'server' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, chat, migrate, game]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_REF }}
      - name: Resolve SHA
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push ola-chat-server-${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./infra/docker/${{ matrix.service }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ola-chat-server-${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ola-chat-server-${{ matrix.service }}:sha-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify:
    needs: [build-web, build-admin, build-server, build-game-web]
    if: ${{ always() && needs.build-web.result != 'failure' && needs.build-admin.result != 'failure' && needs.build-server.result != 'failure' && needs.build-game-web.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Thông báo Discord
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          title: "✅ Build PRODUCTION thành công"
          description: |
            **Nhánh:** `${{ inputs.ref }}`
            **Tag:** `${{ inputs.tag }}`
            **Thành phần:** ${{ inputs.target }}
          username: GitHub Actions
          nofail: true

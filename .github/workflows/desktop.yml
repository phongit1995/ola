name: Desktop

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Env build (dev = api-dev, production = api prod)'
        required: true
        default: 'production'
        type: choice
        options: [dev, production]
      version:
        description: 'Version app, ví dụ 0.2.0 (để trống thì lấy từ desktop/package.json)'
        required: false
        type: string
      publish:
        description: 'Tạo release nháp để app tự cập nhật (chỉ áp dụng production)'
        required: true
        default: true
        type: boolean
      release_now:
        description: 'Phát hành luôn, app người dùng nhận ngay (bỏ tick thì giữ bản nháp)'
        required: true
        default: true
        type: boolean

concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    outputs:
      mac: ${{ steps.drive.outputs.mac }}
      win: ${{ steps.drive.outputs.win }}
      linux: ${{ steps.drive.outputs.linux }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Đặt version
        if: inputs.version != ''
        working-directory: desktop
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const { VERSION } = process.env;
            if (!/^\d+\.\d+\.\d+$/.test(VERSION)) throw new Error('Version phải có dạng 0.2.0');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            fs.writeFileSync('package.json', JSON.stringify({ ...pkg, version: VERSION }, null, 2));
          "

      - name: Build web + main (vite + esbuild, env desktop)
        working-directory: desktop
        run: |
          # dev = build production nhưng API dev: .env.production.local đè .env.production
          if [ "${{ inputs.environment }}" = "dev" ]; then
            cp .env.development .env.production.local
          fi
          echo "== VITE env dùng để build =="
          cat .env .env.production .env.production.local 2>/dev/null || true
          pnpm build:web
          pnpm build:main

      - name: Đóng gói electron-builder (${{ matrix.platform }})
        working-directory: desktop
        env:
          # Không có cert: mac ký ad-hoc theo electron-builder.yml, win build nsis không ký
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        # Gọi thẳng CLI (không qua pnpm exec) để module collector chạy chế độ npm:
        # desktop không có dependency runtime, còn `pnpm list` quét cả monorepo
        # thì nổ EMFILE trên runner Windows.
        run: |
          # Bản dev không được nhận cập nhật từ kênh production
          if [ "${{ inputs.environment }}" = "dev" ]; then
            node -e "const fs=require('fs');const f='electron-builder.yml';fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace(/^publish:\r?\n(?:[ \t]+.*\r?\n)+/m,''))"
          fi
          node ../node_modules/electron-builder/out/cli/cli.js --${{ matrix.platform }} --publish never

      - name: Gom installer
        run: |
          set -e
          BASE="ola-chat"
          if [ "${{ inputs.environment }}" = "dev" ]; then
            BASE="ola-chat-dev"
          fi
          mkdir -p artifacts
          shopt -s nullglob
          for f in desktop/release/*.dmg desktop/release/*.exe desktop/release/*.AppImage desktop/release/*.deb; do
            ext="${f##*.}"
            cp "$f" "artifacts/${BASE}.${ext}"
          done
          ls -la artifacts
          [ -n "$(ls artifacts)" ] || { echo "Không có installer nào!"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ola-desktop-${{ inputs.environment }}-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v4
        if: inputs.publish && inputs.environment == 'production'
        with:
          name: ola-desktop-release-${{ matrix.platform }}
          path: |
            desktop/release/latest*.yml
            desktop/release/*.blockmap
            desktop/release/*.zip
            desktop/release/*.dmg
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error
          retention-days: 1

      - name: Upload lên Google Drive
        id: drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          set -e
          # Cài rclone theo OS
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install rclone -y >/dev/null
            export PATH="$PATH:/c/ProgramData/chocolatey/bin"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install rclone >/dev/null
          else
            curl -fsSL https://rclone.org/install.sh | sudo bash
          fi

          # Config từ secret, trỏ tường minh để đồng nhất 3 OS
          printf '%s' "$RCLONE_CONF" > rclone.conf
          RC="rclone --config rclone.conf"

          ENV="${{ inputs.environment }}"
          OS="${{ matrix.platform }}"
          DEST="olagdrive:Ola Desktop Builds"
          $RC mkdir "$DEST"

          LINKS=""
          for f in artifacts/*; do
            FILE="$(basename "$f")"
            # Đổi tên ngay trên Drive để giữ ID file, link đã share không đổi
            OLD_FILE="ola-desktop-${ENV}-${OS}.${FILE##*.}"
            if $RC lsf "$DEST" | grep -xF "$OLD_FILE" >/dev/null; then
              $RC moveto "$DEST/$OLD_FILE" "$DEST/$FILE"
            fi
            $RC copy "$f" "$DEST" --progress
            LINK=$($RC link "$DEST/$FILE")
            echo "Drive link: $FILE -> $LINK"
            LINKS="${LINKS}[${FILE}](${LINK})"$'\n'
          done

          # Dọn file cũ còn số build trong tên, file mới cố định tên nên ghi đè lên nhau
          $RC lsf "$DEST" \
            | grep -E "^ola-desktop-${ENV}-[0-9]+-${OS}\." \
            | while read -r old; do
                echo "Xoá bản cũ: $old"
                $RC deletefile "$DEST/$old" || echo "  (bỏ qua, không xoá được: $old)"
              done || true

          # Trả link cho job notify (mỗi leg chỉ set key của OS mình)
          {
            echo "${OS}<<OLA_EOF"
            printf '%s' "$LINKS"
            echo ""
            echo "OLA_EOF"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: build
    if: inputs.publish && inputs.environment == 'production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ola-desktop-release-*
          path: release-files
          merge-multiple: true

      - name: Ký bản cập nhật Mac
        env:
          DESKTOP_UPDATE_SIGNING_KEY: ${{ secrets.DESKTOP_UPDATE_SIGNING_KEY }}
        run: |
          node <<'EOF'
          const crypto = require('crypto');
          const fs = require('fs');
          const metadataPath = 'release-files/latest-mac.yml';
          const metadata = fs.readFileSync(metadataPath, 'utf8');
          const field = (name) => new RegExp(`^${name}: (.+)$`, 'm').exec(metadata)[1].trim();
          const version = field('version');
          const zip = fs.readFileSync(`release-files/${field('path')}`);
          const sha512 = crypto.createHash('sha512').update(zip).digest('base64');
          if (sha512 !== field('sha512')) throw new Error('sha512 của zip không khớp latest-mac.yml');
          const signature = crypto.sign(null, Buffer.from(`${version}\n${sha512}`), process.env.DESKTOP_UPDATE_SIGNING_KEY);
          fs.appendFileSync(metadataPath, `updateSignature: ${signature.toString('base64')}\n`);
          EOF

      - name: Tạo release nháp
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_NOW: ${{ inputs.release_now }}
        run: |
          set -e
          REPO="$(awk '/^  owner:/{o=$2} /^  repo:/{r=$2} END{print o "/" r}' desktop/electron-builder.yml)"
          VERSION="${INPUT_VERSION:-$(jq -r .version desktop/package.json)}"
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG đã có trên $REPO: nhập version mới hoặc xoá bản nháp cũ."
            exit 1
          fi
          ls -la release-files
          DRAFT_FLAG="--draft"
          if [ "$RELEASE_NOW" = "true" ]; then
            DRAFT_FLAG=""
          fi
          gh release create "$TAG" release-files/* \
            --repo "$REPO" \
            $DRAFT_FLAG \
            --title "Ola Chat ${VERSION}" \
            --notes "Build #${{ github.run_number }}, commit ${GITHUB_SHA:0:7}"
          if [ -n "$DRAFT_FLAG" ]; then
            echo "Đã tạo bản nháp $TAG trên $REPO, kiểm tra rồi bấm Publish."
          else
            echo "Đã phát hành $TAG trên $REPO."
          fi

  notify:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gửi Discord (1 message)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          RESULT: ${{ needs.build.result }}
          MAC_LINKS: ${{ needs.build.outputs.mac }}
          WIN_LINKS: ${{ needs.build.outputs.win }}
          LINUX_LINKS: ${{ needs.build.outputs.linux }}
        run: |
          set -e
          ENV="${{ inputs.environment }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if [ "$RESULT" = "success" ]; then
            if [ "$ENV" = "production" ]; then COLOR=3066993; else COLOR=15105570; fi
            PAYLOAD=$(jq -n \
              --arg env "$ENV" \
              --arg run "#${{ github.run_number }}" \
              --arg sha "${GITHUB_SHA:0:7}" \
              --arg mac "$MAC_LINKS" \
              --arg win "$WIN_LINKS" \
              --arg linux "$LINUX_LINKS" \
              --arg ts "$TS" \
              --argjson color "$COLOR" \
              '{
                embeds: [{
                  title: "🖥️ Ola Desktop — Bản build mới (mac + win + linux)",
                  description: "Installer 3 OS đã sẵn sàng tải về ⬇️",
                  color: $color,
                  timestamp: $ts,
                  fields: [
                    {name: "Môi trường", value: ("`" + $env + "`"), inline: true},
                    {name: "Build", value: ("`" + $run + "`"), inline: true},
                    {name: "Commit", value: ("`" + $sha + "`"), inline: true},
                    {name: "🍎 macOS", value: $mac, inline: false},
                    {name: "🪟 Windows", value: $win, inline: false},
                    {name: "🐧 Linux", value: $linux, inline: false}
                  ],
                  footer: {text: "Ola CI · GitHub Actions"}
                }]
              }')
          else
            PAYLOAD=$(jq -n \
              --arg env "$ENV" \
              --arg run "#${{ github.run_number }}" \
              --arg sha "${GITHUB_SHA:0:7}" \
              --arg url "$RUN_URL" \
              --arg ts "$TS" \
              '{
                embeds: [{
                  title: "❌ Ola Desktop — build LỖI",
                  description: ("Xem log: " + $url),
                  url: $url,
                  color: 15158332,
                  timestamp: $ts,
                  fields: [
                    {name: "Môi trường", value: ("`" + $env + "`"), inline: true},
                    {name: "Build", value: ("`" + $run + "`"), inline: true},
                    {name: "Commit", value: ("`" + $sha + "`"), inline: true}
                  ],
                  footer: {text: "Ola CI · GitHub Actions"}
                }]
              }')
          fi
          curl -sf -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

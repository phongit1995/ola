name: web-docker

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'infra/web/**'
      - '.dockerignore'
      - '.github/workflows/web-docker.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag cho image (vd: latest, v1.0.0)'
        required: true
        default: 'latest'
      vite_api_url:
        description: 'VITE_API_URL bake vào bundle lúc build'
        required: true
        default: 'http://localhost:8080'

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ola-web

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build params
        id: params
        run: |
          echo "tag=${{ inputs.tag || 'latest' }}" >> "$GITHUB_OUTPUT"
          echo "api_url=${{ inputs.vite_api_url || vars.VITE_API_URL || 'http://localhost:8080' }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.params.outputs.tag }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ steps.params.outputs.api_url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Đã push lên Docker Hub" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.IMAGE }}:${{ steps.params.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ env.IMAGE }}:sha-${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull về host: \`docker pull ${{ env.IMAGE }}:${{ steps.params.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"

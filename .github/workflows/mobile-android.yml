name: Mobile Android

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Env build (dev = api-dev, production = api prod)'
        required: true
        default: 'dev'
        type: choice
        options: [dev, production]
      output:
        description: 'Đầu ra: apk (tester, Drive) / aab (Play Console) / both'
        required: true
        default: 'apk'
        type: choice
        options: [apk, aab, both]
      ref:
        description: 'Nhánh/tag muốn build (bỏ trống = nhánh đang chọn ở "Use workflow from")'
        required: false
        type: string

concurrency:
  group: mobile-android-${{ inputs.ref || github.ref }}-${{ inputs.environment }}-${{ inputs.output }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      BUILD_APK: ${{ inputs.output == 'apk' || inputs.output == 'both' }}
      BUILD_AAB: ${{ inputs.output == 'aab' || inputs.output == 'both' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Ghi nhận commit được build
        run: |
          echo "ref=${{ inputs.ref || github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Chọn env file
        working-directory: mobile
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            cp env.production .env
          else
            cp env.development .env
          fi
          echo "== .env dùng để build =="
          cat .env

      - name: Kiểm tra keystore release
        working-directory: mobile/android
        run: |
          test -f keystore.properties || { echo "Thiếu mobile/android/keystore.properties"; exit 1; }
          test -f app/olame.keystore || { echo "Thiếu mobile/android/app/olame.keystore"; exit 1; }

      - name: Build release APK (arm64)
        if: env.BUILD_APK == 'true'
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Build release AAB (đủ 4 kiến trúc cho Play)
        if: env.BUILD_AAB == 'true'
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Gom artifact + kiểm tra chữ ký
        run: |
          mkdir -p artifacts
          ENV="${{ inputs.environment }}"
          RUN="${{ github.run_number }}"
          if [ "$BUILD_APK" = "true" ]; then
            cp mobile/android/app/build/outputs/apk/release/app-release.apk "artifacts/ola-me-${ENV}-${RUN}.apk"
          fi
          if [ "$BUILD_AAB" = "true" ]; then
            cp mobile/android/app/build/outputs/bundle/release/app-release.aab "artifacts/ola-me-${ENV}-${RUN}.aab"
          fi
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          for f in artifacts/*; do
            echo "== $f"
            case "$f" in
              *.apk) CERT=$("$APKSIGNER" verify --print-certs "$f" | grep 'certificate DN') ;;
              *.aab) CERT=$(jarsigner -verify -verbose:summary -certs "$f" | grep -m1 'CN=') ;;
            esac
            echo "$CERT"
            echo "$CERT" | grep -q 'CN=Ola Me' || { echo "Ký sai keystore (không phải CN=Ola Me): $f"; exit 1; }
          done
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ola-me-android-${{ inputs.environment }}-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK lên Google Drive + gửi Discord
        if: env.BUILD_APK == 'true'
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -e
          # Cài rclone
          curl -fsSL https://rclone.org/install.sh | sudo bash

          # Ghi config từ secret
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

          ENV="${{ inputs.environment }}"
          APK="artifacts/ola-me-${ENV}-${{ github.run_number }}.apk"
          DEST="olagdrive:Ola APK Builds"
          FILE="$(basename "$APK")"

          # Upload
          rclone mkdir "$DEST"
          rclone copy "$APK" "$DEST" --progress

          # Chỉ giữ 2 bản mới nhất của env này, xoá các bản cũ hơn
          rclone lsf "$DEST" \
            | grep -E "^ola(-me)?-${ENV}-.*\.apk$" \
            | sort -t- -k3 -rn \
            | tail -n +3 \
            | while read -r old; do
                echo "Xoá bản cũ: $old"
                rclone deletefile "$DEST/$old" || echo "  (bỏ qua, không xoá được: $old)"
              done

          # Lấy link public
          LINK=$(rclone link "$DEST/$FILE")
          echo "Drive link: $LINK"

          # Gửi Discord (embed) — xanh cho production, cam cho dev
          if [ "$ENV" = "production" ]; then COLOR=3066993; else COLOR=15105570; fi
          if [ "$BUILD_AAB" = "true" ]; then
            AAB_NOTE="AAB cho Play Console nằm trong artifact của run này: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            AAB_NOTE="Không build AAB ở run này."
          fi
          PAYLOAD=$(jq -n \
            --arg env "$ENV" \
            --arg ref "${{ inputs.ref || github.ref_name }}" \
            --arg run "#${{ github.run_number }}" \
            --arg sha "$(git rev-parse --short HEAD)" \
            --arg link "$LINK" \
            --arg file "$FILE" \
            --arg aab "$AAB_NOTE" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: "📱 Ola Me Android — Bản build mới",
                description: "APK đã sẵn sàng tải về ⬇️",
                url: $link,
                color: $color,
                timestamp: $ts,
                fields: [
                  {name: "Môi trường", value: ("`" + $env + "`"), inline: true},
                  {name: "Nhánh", value: ("`" + $ref + "`"), inline: true},
                  {name: "Build", value: ("`" + $run + "`"), inline: true},
                  {name: "Commit", value: ("`" + $sha + "`"), inline: true},
                  {name: "Tải APK", value: ("[" + $file + "](" + $link + ")"), inline: false},
                  {name: "AAB", value: $aab, inline: false}
                ],
                footer: {text: "Ola CI · GitHub Actions"}
              }]
            }')
          curl -sf -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

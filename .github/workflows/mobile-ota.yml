name: Mobile OTA Release

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'App version native mà bundle này áp (phải khớp versionName Android / MARKETING_VERSION iOS đã cài, vd 1.0.0)'
        required: true
        type: string
      notes:
        description: 'Ghi chú thay đổi'
        required: true
        type: string

# Một hàng đợi chung: các lần chạy song song sẽ tính trùng tag và ghi đè manifest của nhau.
concurrency:
  group: mobile-ota
  cancel-in-progress: false

jobs:
  release-ota:
    runs-on: ubuntu-latest
    env:
      OTA_REPO: ducphanvanntq/ola-release
      GH_TOKEN: ${{ secrets.OTA_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build bundle + tạo OTA release
        env:
          APP_VERSION: ${{ inputs.app_version }}
          NOTES: ${{ inputs.notes }}
        run: bash mobile/scripts/ota-release.sh "$APP_VERSION" "$NOTES"

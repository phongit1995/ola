name: Build

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Loại image build'
        required: false
        default: 'dev'
        type: choice
        options: [dev, production]
      tag:
        description: 'Image tag (latest, v1.2.3, ...)'
        required: false
        default: 'latest'
        type: string
      target:
        description: 'Thành phần cần build'
        required: false
        default: 'both'
        type: choice
        options: [both, web, server]
      vite_api_url:
        description: 'VITE_API_URL bake vào web bundle (để trống = tự theo environment)'
        required: false
        default: ''
        type: string

concurrency:
  group: build-${{ github.ref }}-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ inputs.tag || 'latest' }}
  SUFFIX: ${{ inputs.environment == 'dev' && '-dev' || '' }}
  WEB_API_URL: ${{ inputs.environment == 'dev' && 'https://api-dev.ola-server.click/api/v1' || 'https://chat.ola-server.click/api/v1' }}
  WEB_SOCKET_URL: ${{ inputs.environment == 'dev' && 'https://api-dev.ola-server.click' || 'https://chat.ola-server.click' }}

jobs:
  build-web:
    if: ${{ inputs.target == 'web' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Resolve web API guard secret
        id: guard
        run: |
          if [ "${{ inputs.environment }}" = "dev" ]; then
            VAL="$(grep -E '^API_GUARD_SECRET=' env.development | head -1 | cut -d= -f2-)"
          else
            VAL='${{ secrets.VITE_API_GUARD_SECRET }}'
          fi
          echo "::add-mask::$VAL"
          echo "value=$VAL" >> "$GITHUB_OUTPUT"
      - name: Build & push ola-web${{ env.SUFFIX }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ola-web${{ env.SUFFIX }}:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ola-web${{ env.SUFFIX }}:sha-${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ inputs.vite_api_url || env.WEB_API_URL }}
            VITE_SOCKET_URL=${{ env.WEB_SOCKET_URL }}
            VITE_API_GUARD_SECRET=${{ steps.guard.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-server:
    if: ${{ inputs.target == 'server' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, chat, migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push ola-chat-server-${{ matrix.service }}${{ env.SUFFIX }}
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./infra/docker/${{ matrix.service }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ola-chat-server-${{ matrix.service }}${{ env.SUFFIX }}:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ola-chat-server-${{ matrix.service }}${{ env.SUFFIX }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

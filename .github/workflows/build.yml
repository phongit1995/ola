name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Loại image build'
        required: false
        default: 'dev'
        type: choice
        options: [dev, production]
      tag:
        description: 'Image tag (latest, v1.2.3, ...)'
        required: false
        default: 'latest'
        type: string
      target:
        description: 'Thành phần cần build'
        required: false
        default: 'both'
        type: choice
        options: [both, web, server]
      vite_api_url:
        description: 'VITE_API_URL bake vào web bundle'
        required: false
        default: 'http://localhost:8080'
        type: string

concurrency:
  group: build-${{ github.ref }}-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ inputs.tag || 'latest' }}
  SUFFIX: ${{ (github.event_name == 'push' || inputs.environment == 'dev') && '-dev' || '' }}

jobs:
  build-web:
    if: ${{ github.event_name == 'push' || inputs.target == 'web' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push ola-web${{ env.SUFFIX }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ola-web${{ env.SUFFIX }}:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ola-web${{ env.SUFFIX }}:sha-${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ inputs.vite_api_url || vars.VITE_API_URL || 'http://localhost:8080' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-server:
    if: ${{ github.event_name == 'push' || inputs.target == 'server' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, chat, migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push ola-chat-server-${{ matrix.service }}${{ env.SUFFIX }}
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./infra/docker/${{ matrix.service }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ola-chat-server-${{ matrix.service }}${{ env.SUFFIX }}:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ola-chat-server-${{ matrix.service }}${{ env.SUFFIX }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

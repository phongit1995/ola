name: Build

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Loại image build'
        required: false
        default: 'dev'
        type: choice
        options: [dev, production]
      tag:
        description: 'Image tag (latest, v1.2.3, ...)'
        required: false
        default: 'latest'
        type: string
      target:
        description: 'Thành phần cần build'
        required: false
        default: 'both'
        type: choice
        options: [both, web, server]
      vite_api_url:
        description: 'VITE_API_URL bake vào web bundle (để trống = tự theo environment)'
        required: false
        default: ''
        type: string

concurrency:
  group: build-${{ github.ref }}-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ inputs.tag || 'latest' }}
  SUFFIX: ${{ inputs.environment == 'dev' && '-dev' || '' }}
  WEB_API_URL: ${{ inputs.environment == 'dev' && 'https://api-dev.olachat.net/api/v1' || 'https://api.olachat.net/api/v1' }}
  WEB_SOCKET_URL: ${{ inputs.environment == 'dev' && 'https://api-dev.olachat.net' || 'https://api.olachat.net' }}

jobs:
  build-web:
    if: ${{ inputs.target == 'web' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Prepare web/.env (Vite bake VITE_*)
        run: |
          if [ "${{ inputs.environment }}" = "dev" ]; then
            grep -E '^VITE_' env.development > web/.env
          else
            {
              echo "VITE_API_URL=${{ inputs.vite_api_url || env.WEB_API_URL }}"
              echo "VITE_SOCKET_URL=${{ env.WEB_SOCKET_URL }}"
              echo "VITE_API_GUARD_SECRET=${{ secrets.VITE_API_GUARD_SECRET }}"
              echo "VITE_GEOAPIFY_KEY=${{ secrets.VITE_GEOAPIFY_KEY }}"
            } > web/.env
          fi
      - name: Build & push ola-web${{ env.SUFFIX }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ola-web${{ env.SUFFIX }}:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ola-web${{ env.SUFFIX }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-server:
    if: ${{ inputs.target == 'server' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, chat, migrate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push ola-chat-server-${{ matrix.service }}${{ env.SUFFIX }}
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./infra/docker/${{ matrix.service }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ola-chat-server-${{ matrix.service }}${{ env.SUFFIX }}:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ola-chat-server-${{ matrix.service }}${{ env.SUFFIX }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify:
    needs: [build-web, build-server]
    # Chỉ báo khi build thành công, và phải build đủ cả web + server.
    if: ${{ needs.build-web.result == 'success' && needs.build-server.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Thông báo Discord
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          title: "✅ Build thành công — ${{ inputs.environment }}"
          description: |
            **Thành phần:** ${{ inputs.target }}
            **Tag:** `${{ inputs.tag }}`
            **Commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          username: GitHub Actions
          nofail: true

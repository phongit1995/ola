
services:
  migrate:
    image: ${DOCKERHUB_USERNAME}/ola-chat-server-migrate${IMAGE_SUFFIX:-}:${MIGRATE_VERSION:-latest}
    container_name: ola-chat-server-migrate${CONTAINER_SUFFIX:-}
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-ola_chat_server}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres123}
      - DB_SSL_MODE=${DB_SSL_MODE:-disable}
      - SCYLLA_HOST=${SCYLLA_HOST:-scylladb}
      - SCYLLA_PORT=${SCYLLA_PORT:-9042}
      - SCYLLA_KEYSPACE=${SCYLLA_KEYSPACE:-ola_chat_server}
      - SCYLLA_CONSISTENCY=${SCYLLA_CONSISTENCY:-QUORUM}
      - MIGRATION_ACTION=${MIGRATION_ACTION:-up}
      - MIGRATE_DB=${MIGRATE_DB:-all}
    depends_on:
      postgres:
        condition: service_healthy
      scylladb:
        condition: service_healthy
    networks:
      - chat-network
    restart: "no"

  api:
    image: ${DOCKERHUB_USERNAME}/ola-chat-server-api${IMAGE_SUFFIX:-}:${API_VERSION:-latest}
    container_name: ola-chat-server-api${CONTAINER_SUFFIX:-}
    restart: unless-stopped
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-ola_chat_server}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres123}
      - DB_SSL_MODE=${DB_SSL_MODE:-disable}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
      - REDIS_DB=${REDIS_DB:-0}
      - WEBSOCKET_REDIS_HOST=${WEBSOCKET_REDIS_HOST:-redis}
      - WEBSOCKET_REDIS_PORT=${WEBSOCKET_REDIS_PORT:-6379}
      - WEBSOCKET_REDIS_PASSWORD=${WEBSOCKET_REDIS_PASSWORD:-redis123}
      - WEBSOCKET_REDIS_DB=${WEBSOCKET_REDIS_DB:-1}
      - SCYLLA_HOST=${SCYLLA_HOST:-scylladb}
      - SCYLLA_PORT=${SCYLLA_PORT:-9042}
      - SCYLLA_KEYSPACE=${SCYLLA_KEYSPACE:-ola_chat_server}
      - SCYLLA_CONSISTENCY=${SCYLLA_CONSISTENCY:-QUORUM}
      - SERVER_PORT=${SERVER_PORT:-8080}
      - SERVER_HOST=${SERVER_HOST:-0.0.0.0}
      - GIN_MODE=${GIN_MODE:-release}
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret-change-in-production-min-32-chars}
      - JWT_EXPIRY=${JWT_EXPIRY:-24h}
      - API_GUARD_SECRET=${API_GUARD_SECRET:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - WS_READ_BUFFER_SIZE=${WS_READ_BUFFER_SIZE:-1024}
      - WS_WRITE_BUFFER_SIZE=${WS_WRITE_BUFFER_SIZE:-1024}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
      - S3_ENDPOINT=${S3_ENDPOINT:-s3:9000}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin123}
      - S3_BUCKET=${S3_BUCKET:-chat-uploads}
      - S3_USE_SSL=${S3_USE_SSL:-false}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://localhost:9000}
      - SWAGGER_HOST=${SWAGGER_HOST:-api:8080}
      - SERVICE_NAME=api
    depends_on:
      - postgres
      - redis
      - scylladb
      - kafka
      - migrate
      - s3
    networks:
      - chat-network

  chat:
    image: ${DOCKERHUB_USERNAME}/ola-chat-server-chat${IMAGE_SUFFIX:-}:${CHAT_VERSION:-latest}
    container_name: ola-chat-server-chat${CONTAINER_SUFFIX:-}
    restart: unless-stopped
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis123}
      - REDIS_DB=${REDIS_DB:-0}
      - WEBSOCKET_REDIS_HOST=${WEBSOCKET_REDIS_HOST:-redis}
      - WEBSOCKET_REDIS_PORT=${WEBSOCKET_REDIS_PORT:-6379}
      - WEBSOCKET_REDIS_PASSWORD=${WEBSOCKET_REDIS_PASSWORD:-redis123}
      - WEBSOCKET_REDIS_DB=${WEBSOCKET_REDIS_DB:-1}
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret-change-in-production-min-32-chars}
      - JWT_EXPIRY=${JWT_EXPIRY:-24h}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-kafka:9092}
      - CHAT_PORT=${CHAT_PORT:-8081}
      - SERVICE_NAME=chat
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-ola_chat_server}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres123}
      - DB_SSL_MODE=${DB_SSL_MODE:-disable}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      - redis
      - kafka
    networks:
      - chat-network

  web:
    image: ${DOCKERHUB_USERNAME}/ola-web${IMAGE_SUFFIX:-}:${WEB_VERSION:-latest}
    container_name: ola-web${CONTAINER_SUFFIX:-}
    restart: unless-stopped
    labels:
      - dockflare.enable=${WEB_DOCKFLARE_ENABLE:-true}
      - dockflare.hostname=${WEB_DOMAIN:-web.ola-server.click}
      - dockflare.service=http://${DEPLOY_HOST:-phong.local}:${WEB_PORT:-5081}
    ports:
      - "${WEB_PORT:-5081}:80"
    networks:
      - chat-network

  admin:
    image: ${DOCKERHUB_USERNAME}/ola-admin${IMAGE_SUFFIX:-}:${ADMIN_VERSION:-latest}
    container_name: ola-admin${CONTAINER_SUFFIX:-}
    restart: unless-stopped
    labels:
      - dockflare.enable=${ADMIN_DOCKFLARE_ENABLE:-true}
      - dockflare.hostname=${ADMIN_DOMAIN:-admin.ola-server.click}
      - dockflare.service=http://${DEPLOY_HOST:-phong.local}:${ADMIN_PORT:-5083}
    ports:
      - "${ADMIN_PORT:-5083}:80"
    networks:
      - chat-network

  nginx:
    image: nginx:alpine
    container_name: ola-chat-server-nginx${CONTAINER_SUFFIX:-}
    restart: unless-stopped
    labels:
      - dockflare.enable=${DOCKFLARE_ENABLE:-false}
      - dockflare.hostname=${CHAT_DOMAIN:-}
      - dockflare.service=http://${DEPLOY_HOST:-phong.local}:${NGINX_PORT:-5241}
    ports:
      - "${NGINX_PORT:-5241}:80"
    volumes:
      - ./infra/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - chat
    networks:
      - chat-network

  s3:
    image: minio/minio:latest
    container_name: ola-chat-server-s3${CONTAINER_SUFFIX:-}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    labels:
      - dockflare.enable=${S3_DOCKFLARE_ENABLE:-false}
      - dockflare.hostname=${S3_DOMAIN:-storage.ola-server.click}
      - dockflare.service=http://${DEPLOY_HOST:-phong.local}:${S3_PORT:-9000}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    volumes:
      - minio_data:/data
    networks:
      - chat-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: ola-chat-server-postgres${CONTAINER_SUFFIX:-}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ola_chat_server}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chat-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ola-chat-server-redis${CONTAINER_SUFFIX:-}
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - chat-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  scylladb:
    image: scylladb/scylla:5.4.3
    container_name: ola-chat-server-scylladb${CONTAINER_SUFFIX:-}
    restart: unless-stopped
    command: --smp 2 --memory 2G --overprovisioned 1 --api-address 0.0.0.0
    ports:
      - "${SCYLLA_CQL_PORT:-9042}:9042"
      - "${SCYLLA_THRIFT_PORT:-9160}:9160"
      - "${SCYLLA_API_PORT:-10000}:10000"
    volumes:
      - scylla_data:/var/lib/scylla
    networks:
      - chat-network
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ola-chat-server-kafka${CONTAINER_SUFFIX:-}
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - chat-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  scylla_data:
  kafka_data:
  minio_data:

networks:
  chat-network:
    driver: bridge

<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cờ Caro - Ola</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="player" id="player-me">
          <span class="mark x">X</span>
          <span class="name">Bạn</span>
        </div>
        <div id="center">
          <div id="status">Sẵn sàng</div>
          <div id="timer" class="hidden">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="10" />
              <polyline points="12 6 12 12 16 14" />
            </svg>
            <span id="timer-val">45s</span>
          </div>
        </div>
        <div class="player right" id="player-op">
          <span class="mark o">O</span>
          <span class="name">---</span>
        </div>
      </header>

      <main id="board-wrap">
        <div id="board"></div>
        <div id="overlay">
          <div id="overlay-card">
            <div id="overlay-logo" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                <path d="M3 9h18M3 15h18M9 3v18M15 3v18" />
                <path class="logo-x" d="M4.6 4.6l2.8 2.8M7.4 4.6L4.6 7.4" stroke-width="1.8" />
                <circle class="logo-o" cx="12" cy="12" r="1.6" stroke-width="1.8" />
              </svg>
            </div>
            <h2 id="overlay-title">Cờ Caro</h2>
            <p id="overlay-sub">5 quân liên tiếp để thắng</p>

            <div id="level-picker">
              <span class="level-label">Độ khó của máy</span>
              <div id="level-options" role="radiogroup" aria-label="Độ khó của máy">
                <button type="button" data-level="easy" role="radio" aria-checked="false">Dễ</button>
                <button type="button" data-level="normal" role="radio" aria-checked="true" class="selected">Thường</button>
                <button type="button" data-level="hard" role="radio" aria-checked="false">Khó</button>
              </div>
            </div>

            <div id="overlay-actions">
              <button type="button" id="btn-bot">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 8V4H8" />
                  <rect width="16" height="12" x="4" y="8" rx="2" />
                  <path d="M2 14h2M20 14h2M15 13v2M9 13v2" />
                </svg>
                Chơi với máy
              </button>
              <button type="button" id="btn-online" class="secondary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="12" cy="12" r="10" />
                  <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20" />
                </svg>
                Tìm trận online
              </button>
            </div>
          </div>
        </div>
      </main>

      <footer id="bottombar">
        <button type="button" id="btn-forfeit" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z" />
            <line x1="4" x2="4" y1="22" y2="15" />
          </svg>
          Bỏ cuộc
        </button>
        <button type="button" id="btn-exit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" x2="9" y1="12" y2="12" />
          </svg>
          Thoát
        </button>
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

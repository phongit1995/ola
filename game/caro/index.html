<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cờ Caro - Ola</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app" data-asset-bg="boardBg">
      <header id="topbar">
        <div class="player" id="player-me">
          <div class="p-avatar" data-asset-bg="boardAvatarFrame">
            <span class="mark x">X</span>
          </div>
          <span class="name">Bạn</span>
        </div>
        <div id="center">
          <div id="timer" class="hidden" data-asset-bg="boardTimerFrame">
            <span id="timer-val">00:45</span>
          </div>
          <img id="turn-arrow" class="hidden" alt="" />
          <div id="status">Sẵn sàng</div>
        </div>
        <div class="player right" id="player-op">
          <div class="p-avatar" data-asset-bg="boardAvatarFrame">
            <span class="mark o">O</span>
          </div>
          <span class="name">---</span>
        </div>
      </header>

      <main id="board-wrap">
        <div id="board-frame" data-asset-bg="boardFrame">
          <div id="board"></div>
        </div>
        <div id="overlay">
          <div id="overlay-card">
            <div id="overlay-logo" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                <path d="M3 9h18M3 15h18M9 3v18M15 3v18" />
                <path class="logo-x" d="M4.6 4.6l2.8 2.8M7.4 4.6L4.6 7.4" stroke-width="1.8" />
                <circle class="logo-o" cx="12" cy="12" r="1.6" stroke-width="1.8" />
              </svg>
            </div>
            <h2 id="overlay-title">Cờ Caro</h2>
            <p id="overlay-sub">5 quân liên tiếp để thắng</p>

            <div id="overlay-actions">
              <button type="button" id="btn-again" class="hidden">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3 12a9 9 0 1 0 2.6-6.3L3 8" />
                  <path d="M3 3v5h5" />
                </svg>
                Chơi lại
              </button>
              <button type="button" id="btn-cancel" class="secondary hidden">Hủy tìm trận</button>
              <button type="button" id="btn-lobby" class="secondary hidden">Về sảnh</button>
            </div>
          </div>
        </div>
      </main>

      <footer id="bottombar">
        <button type="button" id="btn-replay" class="hidden" data-asset-bg="boardMenuBtn">Chơi lại</button>
        <button type="button" id="btn-forfeit" data-asset-bg="boardMenuBtn" disabled>Bỏ cuộc</button>
        <button type="button" id="btn-exit" data-asset-bg="boardMenuBtn">Thoát</button>
      </footer>
    </div>

    <div id="lobby" class="loading" data-loading="Đang tải...">
      <div id="lobby-inner" data-asset-bg="bg">
        <div class="lobby-top-space"></div>
        <div id="lobby-content">
          <div class="lobby-avatar" data-asset-bg="avatarFrame">
            <img id="lobby-vip" class="hidden" alt="VIP" />
          </div>
          <div class="lobby-name" data-asset-bg="nameFrame">
            <span id="lobby-name-text">...</span>
          </div>
          <div class="lobby-ken" data-asset-bg="kenFrame">
            <img class="lobby-ken-icon" data-asset="icKen" alt="Ken" />
            <span id="lobby-ken-text">0</span>
            <button type="button" id="lobby-plus" data-asset-bg="btnPlus" aria-label="Nạp Ken">
              <img data-asset="icPlus" alt="" />
            </button>
          </div>
          <button type="button" class="lobby-mode" id="lobby-bot" data-asset-bg="modeFrame">
            <img data-asset="icBot" alt="" />
            <span>Chơi với máy</span>
          </button>
          <button type="button" class="lobby-mode" id="lobby-ranked" data-asset-bg="modeFrame">
            <img data-asset="icRanked" alt="" />
            <span>Chơi xếp hạng</span>
          </button>
        </div>
        <div id="lobby-status">
          <span id="lobby-status-text">Đang kết nối máy chủ...</span>
          <button type="button" id="lobby-retry" class="hidden">Thử lại</button>
        </div>
        <div class="lobby-bottom" data-asset-bg="bottomFrame">
          <button type="button" id="lobby-history">
            <img data-asset="icHistory" alt="" />
            <span>Lịch sử</span>
          </button>
          <button type="button" id="lobby-leaderboard">
            <img data-asset="icLeaderboard" alt="" />
            <span>Bảng xếp hạng</span>
          </button>
          <button type="button" id="lobby-exit">
            <img data-asset="icExit" alt="" />
            <span>Thoát</span>
          </button>
        </div>
        <div id="lobby-toast" class="hidden"></div>
      </div>
      <div id="lobby-pick" class="hidden">
        <div id="lobby-pick-card" data-asset-bg="pickBg">
          <div class="pick-body">
            <div id="lobby-pick-title" data-asset-bg="pickTitle">
              <span>Chơi với máy</span>
            </div>
            <div id="lobby-pick-levels">
              <button type="button" data-level="easy" data-asset-bg="pickLevel"><span>Dễ</span></button>
              <button type="button" data-level="normal" data-asset-bg="pickLevel"><span>Vừa</span></button>
              <button type="button" data-level="hard" data-asset-bg="pickLevel"><span>Khó</span></button>
            </div>
          </div>
          <button type="button" id="lobby-pick-close" data-asset-bg="pickClose" aria-label="Đóng">
            <img data-asset="pickX" alt="Đóng" />
          </button>
        </div>
      </div>
    </div>
    <div id="ranked" class="hidden">
      <div id="ranked-inner" data-asset-bg="rankedBg">
        <div class="ranked-title" data-asset-bg="rankedTitleFrame">
          <span>Chơi xếp hạng</span>
          <img data-asset="rankedCup" alt="" />
        </div>
        <div class="ranked-table-wrap">
          <div class="ranked-table" data-asset-bg="rankedTable">
            <div class="ranked-head">
              <span>Chủ bàn</span>
              <span>Ken cược</span>
              <span>Tham gia</span>
            </div>
            <div id="ranked-rows"></div>
            <div id="ranked-empty" class="hidden">Chưa có bàn nào,<br />tạo bàn mới nhé!</div>
          </div>
        </div>
        <div class="ranked-pager">
          <button type="button" id="ranked-prev" data-asset-bg="rankedPageBtn">&lt;</button>
          <span id="ranked-page" data-asset-bg="rankedPageBtn">1</span>
          <button type="button" id="ranked-next" data-asset-bg="rankedPageBtn">&gt;</button>
        </div>
        <div class="ranked-menu">
          <button type="button" id="ranked-create" data-asset-bg="rankedMenuBtn">Tạo bàn</button>
          <button type="button" id="ranked-refresh" data-asset-bg="rankedMenuBtn">Làm mới</button>
          <button type="button" id="ranked-exit" data-asset-bg="rankedMenuBtn">Thoát</button>
        </div>
        <div id="ranked-waiting" class="hidden">
          <span id="ranked-waiting-text">Đang đợi đối thủ vào bàn...</span>
          <button type="button" id="ranked-waiting-cancel">Hủy bàn</button>
        </div>
        <div id="ranked-toast" class="hidden"></div>
      </div>
      <div id="ranked-create-modal" class="hidden">
        <div id="create-card" data-asset-bg="createPanel">
          <div class="create-title" data-asset-bg="createTitleFrame"><span>Tạo bàn</span></div>
          <button type="button" id="create-close" data-asset-bg="createBtnClose" aria-label="Đóng">
            <img data-asset="createIcX" alt="" />
          </button>
          <div class="create-body">
            <div class="create-label" data-asset-bg="createLabelFrame"><span>Số Ken</span></div>
            <div class="create-input" data-asset-bg="createInputFrame">
              <input id="create-bet" type="number" inputmode="numeric" min="0" placeholder="0" />
            </div>
            <div class="create-label" data-asset-bg="createLabelFrame"><span>Mật khẩu</span></div>
            <div class="create-input" data-asset-bg="createInputFrame">
              <input id="create-password" type="text" autocomplete="off" placeholder="Để trống nếu không khóa" />
            </div>
            <button type="button" id="create-ok" data-asset-bg="createBtnOk"><span>OK</span></button>
          </div>
        </div>
      </div>
      <div id="ranked-pass-modal" class="hidden">
        <div id="pass-card">
          <h3>Bàn có khóa</h3>
          <div class="create-input" data-asset-bg="createInputFrame">
            <input id="pass-input" type="text" autocomplete="off" placeholder="Nhập mật khẩu" />
          </div>
          <div class="pass-actions">
            <button type="button" id="pass-ok">Vào bàn</button>
            <button type="button" id="pass-cancel">Hủy</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

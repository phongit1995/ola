<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>War God - Ola</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="fighter" id="f-me">
          <div class="f-head">
            <span class="f-name">Bạn</span>
            <span class="f-armor" id="me-armor"></span>
          </div>
          <div class="bar hp"><div class="fill" id="me-hp"></div><span class="bar-text" id="me-hp-text">100/100</span></div>
          <div class="bar mp"><div class="fill" id="me-mp"></div><span class="bar-text" id="me-mp-text">0/100</span></div>
          <button type="button" id="btn-ult" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z" />
            </svg>
            TUYỆT CHIÊU
          </button>
        </div>
        <div id="center">
          <div id="turn-badge">LƯỢT<span id="turn-count">1</span></div>
          <div id="status">Sẵn sàng</div>
        </div>
        <div class="fighter right" id="f-foe">
          <div class="f-head">
            <span class="f-name">Máy 🤖</span>
            <span class="f-armor" id="foe-armor"></span>
          </div>
          <div class="bar hp"><div class="fill" id="foe-hp"></div><span class="bar-text" id="foe-hp-text">100/100</span></div>
          <div class="bar mp"><div class="fill" id="foe-mp"></div><span class="bar-text" id="foe-mp-text">0/100</span></div>
          <div class="ult-tag" id="foe-ult">TUYỆT CHIÊU</div>
        </div>
      </header>

      <div id="hint">Ghép 3 ô trở lên để tấn công đối thủ!</div>

      <main id="board-wrap">
        <div id="board-host"></div>
        <div id="overlay">
          <div id="overlay-card">
            <div id="overlay-logo" aria-hidden="true">⚔️</div>
            <h2 id="overlay-title">WAR GOD</h2>
            <p id="overlay-sub">Ghép 3 ô trở lên để tấn công đối thủ. Đủ 50 MP để tung TUYỆT CHIÊU!</p>
            <div id="overlay-actions">
              <button type="button" id="btn-start">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 8V4H8" />
                  <rect width="16" height="12" x="4" y="8" rx="2" />
                  <path d="M2 14h2M20 14h2M15 13v2M9 13v2" />
                </svg>
                Chơi với máy
              </button>
            </div>
          </div>
        </div>
      </main>

      <footer id="bottombar">
        <button type="button" id="btn-forfeit" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z" />
            <line x1="4" x2="4" y1="22" y2="15" />
          </svg>
          Bỏ cuộc
        </button>
        <div id="legend">⚔️🔥 đánh · ❤️ hồi · 💧 MP · 🛡️ giáp</div>
        <button type="button" id="btn-exit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" x2="9" y1="12" y2="12" />
          </svg>
          Thoát
        </button>
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

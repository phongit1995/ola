appId: net.olachat.desktop
productName: Ola Chat
directories:
  output: release
  buildResources: build
files:
  - out/**
  - dist/**
  - package.json
asar: true
npmRebuild: false
artifactName: OlaChat-${version}-${os}-${arch}.${ext}

publish:
  provider: github
  owner: dactiennguyen
  repo: ola-release

mac:
  category: public.app-category.social-networking
  target:
    - dmg
    - zip
  identity: '-'
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Ola Chat cần micro để gọi thoại và gửi tin nhắn thoại.
    NSCameraUsageDescription: Ola Chat cần camera để gọi video.

win:
  icon: build/icon-win.png
  target:
    - nsis
nsis:
  oneClick: true
  artifactName: OlaChat-Setup-${version}.${ext}
  # Gỡ app là xoá sạch %APPDATA%\Ola Chat (localStorage/token/cache) — người
  # dùng gỡ-cài-lại sẽ phải đăng nhập lại.
  deleteAppDataOnUninstall: true

linux:
  target:
    - AppImage
    - deb
  category: Network
  maintainer: Ola Chat
  syncDesktopName: true

info:
  contact:
    email: support@chatserver.com
    name: API Support
  description: A chat server API with authentication and real-time messaging
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Chat Server API
  version: "1.0"
paths:
  /admin/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate an admin account and return access + refresh tokens
      parameters:
      - description: Admin Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_admin_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.BaseResponse-internal_modules_admin_auth_LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
      summary: Admin login
      tags:
      - admin-auth
  /admin/auth/me:
    get:
      description: Return the authenticated admin's profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.BaseResponse-internal_modules_admin_auth_AdminDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Current admin profile
      tags:
      - admin-auth
  /admin/auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a valid admin refresh token for a new token pair
      parameters:
      - description: Refresh Token Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_admin_auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.BaseResponse-internal_modules_admin_auth_RefreshTokenResponse'
        "400":
          description: Bad Request
          schema:

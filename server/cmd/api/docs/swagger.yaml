info:
  contact:
    email: support@chatserver.com
    name: API Support
  description: A chat server API with authentication and real-time messaging
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Chat Server API
  version: "1.0"
paths:
  /admin/analytics/overview:
    get:
      parameters:
      - description: Từ ngày (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: Đến ngày (YYYY-MM-DD)
        in: query
        name: to
        type: string
      - description: all | android | ios | web
        in: query
        name: platform
        type: string
      - description: Bỏ qua bộ nhớ đệm
        in: query
        name: refresh
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_admin_analytics.OverviewSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Thống kê Google Analytics gộp Android, iOS và web (admin)
      tags:
      - admin-analytics
  /admin/analytics/realtime:
    get:
      parameters:
      - description: all | android | ios | web
        in: query
        name: platform
        type: string
      - description: Bỏ qua bộ nhớ đệm
        in: query
        name: refresh
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_admin_analytics.RealtimeSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Số người đang dùng trong 30 phút gần nhất (admin)
      tags:
      - admin-analytics
  /admin/announcements:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ola-chat-server_internal_modules_announcement.AnnouncementListResponse'
      security:
      - BearerAuth: []
      summary: Danh sách thông báo (admin)
      tags:
      - admin-announcement
    post:
      consumes:
      - application/json
      parameters:
      - description: Announcement
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ola-chat-server_internal_modules_announcement.CreateAnnouncementRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ola-chat-server_internal_modules_announcement.AnnouncementResponse'
      security:
      - BearerAuth: []
      summary: Tạo thông báo (admin)
      tags:
      - admin-announcement
  /admin/announcements/{id}:
    delete:
      parameters:
      - description: Announcement ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Xoá thông báo (admin)
      tags:
      - admin-announcement
    patch:
      consumes:
      - application/json
      parameters:
      - description: Announcement ID
        in: path
        name: id
        required: true
        type: string
      - description: Announcement
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ola-chat-server_internal_modules_announcement.UpdateAnnouncementRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ola-chat-server_internal_modules_announcement.AnnouncementResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Cập nhật thông báo (admin)
      tags:
      - admin-announcement
  /admin/auth/change-password:
    post:
      consumes:
      - application/json
      description: Change the authenticated admin's password; revokes existing sessions
      parameters:
      - description: Change Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_admin_auth.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Change admin password
      tags:
      - admin-auth
  /admin/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate an admin account and return access + refresh tokens
      parameters:
      - description: Admin Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_admin_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.BaseResponse-internal_modules_admin_auth_LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
      summary: Admin login
      tags:
      - admin-auth
  /admin/auth/logout:
    post:
      description: Revoke the authenticated admin session
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Admin logout
      tags:
      - admin-auth
  /admin/auth/me:
    get:
      description: Return the authenticated admin's profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.BaseResponse-internal_modules_admin_auth_AdminDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Current admin profile
      tags:
      - admin-auth
  /admin/auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a valid admin refresh token for a new token pair
      parameters:
      - description: Refresh Token Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_admin_auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.BaseResponse-internal_modules_admin_auth_RefreshTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
      summary: Refresh admin token
      tags:
      - admin-auth
  /admin/clans:
    get:
      parameters:
      - description: Search by handle
        in: query
        name: q
        type: string
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.BaseResponse-internal_modules_admin_clan_ClanListResponse'
      security:
      - BearerAuth: []
      summary: List clans (admin)
      tags:
      - admin-clan
  /admin/clans/{id}:
    delete:
      parameters:
      - description: Clan ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete clan (admin)
      tags:
      - admin-clan
  /admin/clans/{id}/members:
    get:
      parameters:
      - description: Clan ID
        in: path
        name: id
        required: true
        type: string
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.BaseResponse-internal_modules_admin_clan_MemberListResponse'
      security:
      - BearerAuth: []
      summary: List clan members (admin)
      tags:
      - admin-clan
  /admin/conversations:
    get:
      description: 'hidden=false: hội thoại đang hiển thị, sắp theo tin mới nhất.
        hidden=true: hội thoại user đã ẩn, sắp theo lúc ẩn. missing=true là hội thoại
        không còn dữ liệu'
      parameters:
      - description: User ID
        in: query
        name: userId
        required: true
        type: string
      - description: Lấy hội thoại đã ẩn
        in: query
        name: hidden
        type: boolean
      - description: Số hội thoại (mặc định 30, tối đa 100)
        in: query
        name: limit
        type: integer
      - description: Offset trong snapshot
        in: query
        name: offset
        type: integer
      - description: Snapshot trả về ở trang đầu; bỏ trống để tạo danh sách mới
        in: query
        name: snapshot
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_admin_conversation.ConversationListSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
        "410":
          description: snapshot hết hạn (15 phút), tải lại từ đầu
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Hội thoại của một user (admin, chỉ xem)
      tags:
      - admin-conversation
  /admin/conversations/{id}:
    get:
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_modules_admin_conversation.ConversationDetailSuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Thông tin và thành viên của hội thoại (admin)
      tags:
      - admin-conversation
  /admin/conversations/{id}/messages:
    get:
      description: Trả mới nhất trước, gồm cả tin đã bị xoá (deletedAt). Truyền around
        để lấy các tin quanh một tin (mở từ báo cáo vi phạm)
      parameters:
      - description: Conversation ID

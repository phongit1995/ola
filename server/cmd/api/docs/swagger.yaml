  /chat-bot:
    post:
      consumes:
      - application/json
      description: |-
        Body gồm `messages`, `type` và `stream`. Tính cách của bot do server tự gắn theo `type` (OLALA mặc định, OLAVI là thầy tử vi); client không gửi được message `system`.
        `stream=false` (mặc định) trả JSON đầy đủ theo schema dưới đây.
        `stream=true` trả `text/event-stream`, mỗi frame là một dòng `data: <json>` rồi một dòng trống:
        - chunk nội dung: `{"id":"chatbot-...","delta":"Chào "}`
        - chunk cuối: `{"id":"...","finishReason":"stop"}`
        - nếu lỗi giữa stream: `{"id":"...","error":"..."}`
        - kết thúc: `data: [DONE]`
        Ghép toàn bộ `delta` theo thứ tự sẽ được câu trả lời đầy đủ.
        Có dòng `: ping` xen giữa các frame để giữ kết nối, client bỏ qua dòng không bắt đầu bằng `data: `.
        Giới hạn: tối đa 80 message, 4000 ký tự cho `user`, 32000 ký tự cho `assistant`, toàn bộ body 2MB (vượt trả 413).
      parameters:
      - description: Hội thoại
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_chat-bot.CompletionRequest'
      produces:
      - application/json
      - text/event-stream
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.BaseResponse-internal_modules_chat-bot_CompletionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
        "403":
          description: 'code CHAT_BOT_DISABLED: bot đang tắt'
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
        "429":
          description: 'code CHAT_BOT_DAILY_LIMIT: hết lượt chat hôm nay'
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/ola-chat-server_internal_utils.APIError'
      security:
      - BearerAuth: []
      summary: Chat với bot
      tags:
      - chat-bot

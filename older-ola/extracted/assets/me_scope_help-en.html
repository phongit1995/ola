<html xmlns="http://www.w3.org/1999/xhtml">
	<head>
		<title>Me scope</title>
		<meta http-equiv="Content-Type" content="application/xhtml+xml; charset=UTF-8" />
		<style type="text/css">
			.title {font-weight: bold; font-size: 16px;}
			.tT {margin: 5px; background: transparent url(check-icon.png) left 2px no-repeat;}
			.check span {padding-left: 25px; }
		</style>
	</head>
	<body>
		<div class="title">
			Default
		</div>
			<div class="check">
			<div class="tT">
					<span>Me will be posted as the current privacy setting on your Me page</span>
				</div>
				<div class="title">
			Public
		</div>
			<div class="tT">
					<span>Me will be posted to whole community</span>
				</div>
				<div class="title">
			Friends
		</div>
				<div class="tT">
					<span>Me will be only posted on your friends timeline</span>
				</div>
				<div class="title">
			Targeted
		</div>
				<div class="tT">
					<span>Me will be posted to indicated clan, person only. Me will not be posted on others timeline</span>
				</div>
					
			</div>
		</div>		
	</body>
</html>

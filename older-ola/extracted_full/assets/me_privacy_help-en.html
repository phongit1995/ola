<html xmlns="http://www.w3.org/1999/xhtml">
	<head>
		<title>Me privacy</title>
		<meta http-equiv="Content-Type" content="application/xhtml+xml; charset=UTF-8" />
		<style type="text/css">
			.title {font-weight: bold; font-size: 16px;}
			.tT {margin: 5px; background: transparent url(check-icon.png) left 2px no-repeat;}
			.check span {padding-left: 25px; }
		</style>
	</head>
	<body>
		<div class="title">
			Public
		</div>
			<div class="check">
			<div class="tT">
					<span>Your Me page is visible to everyone</span>
				</div>
				<div class="title">
			Friends
		</div>
			<div class="tT">
					<span>Your Me page is visible to only people whom you care (in your friend list). Others cannot view your Me page</span>
				</div>
				<div class="title">
			Private
		</div>
				<div class="tT">
					<span>Your Me page is visible to no one. In this mode, all your post will not be put to others timeline</span>
				</div>
			</div>
		</div>		
	</body>
</html>

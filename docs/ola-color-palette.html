<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ola 2.1.11 — Bảng màu</title>
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#d5d5d5;margin:0;padding:24px;color:#222}
  h1{margin:0 0 4px}
  .sub{color:#636362;margin-bottom:24px;font-size:14px}
  h2{margin:32px 0 12px;border-left:4px solid #7cb342;padding-left:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .sw{border-radius:6px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .chip{height:72px;display:flex;align-items:flex-end;padding:6px 8px}
  .chip.t{background-image:linear-gradient(45deg,#ccc 25%,transparent 25%),linear-gradient(-45deg,#ccc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ccc 75%),linear-gradient(-45deg,transparent 75%,#ccc 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
  .meta{padding:7px 9px;font-size:12px;line-height:1.45}
  .nm{font-weight:600;word-break:break-all}
  .hex{color:#636362;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase}
</style>
</head>
<body>
<h1>Ola 2.1.11 — Bảng màu UI</h1>
<div class="sub">Trích từ <code>apktool_out/res/values/colors.xml</code> · màu có nền ô caro = có độ trong suốt (alpha)</div>

<h2>🟩 Primary — Xanh lá</h2>
<div class="grid" id="primary"></div>
<h2>🌸 Accent — Hồng / Tím</h2>
<div class="grid" id="accent"></div>
<h2>⬜ Backgrounds</h2>
<div class="grid" id="bg"></div>
<h2>⬛ Text</h2>
<div class="grid" id="text"></div>
<h2>🟥 Semantic / Status</h2>
<div class="grid" id="status"></div>
<h2>🧭 Tabs & Dividers</h2>
<div class="grid" id="tab"></div>
<h2>🫥 Translucent overlays</h2>
<div class="grid" id="overlay"></div>

<script>
// HEX dạng #RRGGBB hoặc #AARRGGBB (Android). Chuyển sang CSS rgba khi có alpha.
function css(hex){
  hex=hex.replace('#','');
  if(hex.length===8){const a=parseInt(hex.slice(0,2),16)/255,r=parseInt(hex.slice(2,4),16),g=parseInt(hex.slice(4,6),16),b=parseInt(hex.slice(6,8),16);return `rgba(${r},${g},${b},${a.toFixed(2)})`;}
  return '#'+hex;
}
const data={
 primary:[['colorOlaPrimary','#7CB342'],['colorOlaPrimaryDark / green_color_basic','#558B2F'],['colorOlaPrimaryDarkMore','#33691E'],['colorOlaPrimaryLight','#F1F8E9'],['buttonGreen','#9CCC65'],['green_light','#CDFBA4'],['vip_nick_color','#65B320'],['colorOlaPrimaryShadown','#337CB342']],
 accent:[['colorOlaAccent / colorAccent','#FF4081'],['colorOlaAccentPrimaryDark','#F50057'],['colorOlaAccentPrimaryLight','#FF80AB'],['colorOlaPurple','#4527A0'],['colorPrimary (không dùng)','#3F51B5'],['colorPrimaryDark (không dùng)','#303F9F']],
 bg:[['app_background_color','#D5D5D5'],['background_holo_light','#F3F3F3'],['background_solid_color','#EEECED'],['background_translucent_80','#CCEEECED'],['image_background_color','#DDDDDD'],['bg_search_box','#A4A4A4'],['color_slide_menu_background','#303030']],
 text:[['colorTextBlackPrimary 87%','#DE000000'],['colorTextBlackSecondaryOrIcon 54%','#8A000000'],['colorTextBlackHintOrDisable 26%','#42000000'],['colorTextBlackDivider 12%','#1F000000'],['colorTextWhitePrimary','#FFFFFF'],['colorTextWhiteSecondary 70%','#B3FFFFFF'],['text_color_1','#A29F9F'],['text_color_3 (link)','#0075B7'],['text_color_5','#636362'],['text_color_7','#808080'],['chat sender','#0B6FBB']],
 status:[['red','#E34545'],['recording remaining','#FFFF0033'],['light_red','#FFCACA'],['orange_comment_tag','#FFB400'],['blue','#0101FF'],['com_smart_login_code','#3C6499']],
 tab:[['bottom_tab_selected','#CC1D1D1D'],['top_tab_unselect','#B2B2B2'],['top_tab_select 50%','#8066AE27'],['listDivider','#DEDCDC'],['separator_line','#64B2B2B2'],['separator_line_1','#E6E6E6']],
 overlay:[['black 25%','#3F000000'],['black 50%','#7F000000'],['black 80%','#CC000000'],['white 50%','#80FFFFFF'],['white 80%','#CCFFFFFF'],['green 20%','#336E8A4F'],['green 80%','#CC6E8A4F'],['vip 60%','#9965B320'],['vip 80%','#CC65B320']]
};
for(const [sec,arr] of Object.entries(data)){
  const host=document.getElementById(sec);
  for(const [nm,hex] of arr){
    const transparent = hex.replace('#','').length===8;
    host.insertAdjacentHTML('beforeend',
      `<div class="sw"><div class="chip ${transparent?'t':''}"><span style="background:${css(hex)};width:100%;height:100%;border-radius:3px"></span></div>
       <div class="meta"><div class="nm">${nm}</div><div class="hex">${hex}</div></div></div>`);
  }
}
</script>
</body>
</html>

apiVersion: 1
groups:
  - orgId: 1
    name: kafka
    folder: Ola
    interval: 1m
    rules:
      - uid: kafka-dlq
        title: "Kafka: message vào DLQ"
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Có message xử lý lỗi sau khi retry, người nhận có thể không nhận được event realtime hoặc push."
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: P8E80F9AEF21F6940
            model:
              refId: A
              editorMode: code
              queryType: instant
              expr: 'sum(count_over_time({env="prod"} |~ "sending to DLQ|Failed to publish to DLQ" [5m]))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
      - uid: kafka-publish-failed
        title: "Kafka: gửi event thất bại"
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Server không gửi được event vào Kafka, tin đã lưu nhưng không có realtime và push."
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: P8E80F9AEF21F6940
            model:
              refId: A
              editorMode: code
              queryType: instant
              expr: 'sum(count_over_time({env="prod"} |= "Failed to publish" != "to DLQ" [5m]))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
      - uid: kafka-consumer-read
        title: "Kafka: consumer lỗi đọc hoặc commit"
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Consumer đang lỗi đọc partition hoặc commit offset."
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: P8E80F9AEF21F6940
            model:
              refId: A
              editorMode: code
              queryType: instant
              expr: 'sum(count_over_time({env="prod"} |~ "Read error|Failed to commit offsets" [5m]))'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0

services:
  loki:
    image: grafana/loki:3.5.0
    container_name: ola-logs-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    mem_limit: 1g

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: ola-logs-grafana
    restart: unless-stopped
    depends_on:
      - loki
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://grafana.olachat.net
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    mem_limit: 512m

  proxy:
    image: nginx:alpine
    container_name: ola-logs-proxy
    restart: unless-stopped
    depends_on:
      - loki
      - grafana
    ports:
      - "5086:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/htpasswd:/etc/nginx/secrets/htpasswd:ro
    mem_limit: 64m
    labels:
      - dockflare.enable=true
      - dockflare.hostname=grafana.olachat.net
      - dockflare.service=http://phong.local:5086
      - dockflare.zonename=olachat.net

volumes:
  loki_data:
  grafana_data:
